<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연간 진행률</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  #barWrap {
    width: 100%;
    padding: 24px 0 8px;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<div id="barWrap"></div>
<script>
(function(){
  // 다크모드 여부는 시스템 설정을 따름 (노션 페이지 테마와 자동 매칭은 안 되므로 라이트 기준 고정 색상 사용)
  const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const trackColor = isDark ? '#2c2c2a' : '#e1e0d9';
  const fillColor = isDark ? '#5DCAA5' : '#0F6E56';
  const todayColor = isDark ? '#F0997B' : '#D85A30';
  const tickColor = isDark ? '#c3c2b7' : '#898781';

  const now = new Date();
  const year = now.getFullYear();
  const isLeap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
  const totalDays = isLeap ? 366 : 365;

  function dayOfYear(m, d) {
    return Math.round((new Date(year, m, d) - new Date(year, 0, 1)) / 86400000) + 1;
  }

  const todayDay = dayOfYear(now.getMonth(), now.getDate());
  const pct = Math.round((todayDay / totalDays) * 1000) / 10;

  const milestones = [
    { day: dayOfYear(0,1), label: '1월 1일' },
    { day: dayOfYear(3,1), label: '4월 1일' },
    { day: dayOfYear(6,1), label: '7월 1일' },
    { day: dayOfYear(9,1), label: '10월 1일' },
    { day: dayOfYear(11, isLeap ? 31 : 31), label: '12월 31일' }
  ];

  const todayLabel = (now.getMonth() + 1) + '월 ' + now.getDate() + '일';

  const W = 700, barY = 60, barH = 10;
  const padX = 20;
  const usableW = W - padX * 2;

  function xForDay(d) { return padX + ((d - 1) / (totalDays - 1)) * usableW; }

  const todayX = xForDay(todayDay);
  const fillW = todayX - padX;

  let ticksSvg = '';
  milestones.forEach(m => {
    const x = xForDay(m.day);
    ticksSvg += '<line x1="' + x + '" y1="' + (barY - 4) + '" x2="' + x + '" y2="' + (barY + barH + 4) + '" stroke="' + tickColor + '" stroke-width="1"/>';
    ticksSvg += '<text x="' + x + '" y="' + (barY + barH + 20) + '" text-anchor="middle" font-size="12" fill="' + tickColor + '">' + m.label + '</text>';
  });

  const svg = '<svg viewBox="0 0 ' + W + ' 110" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; overflow:visible;">' +
    '<text x="' + padX + '" y="' + (barY - 22) + '" text-anchor="start" font-size="13" font-weight="500" fill="' + tickColor + '">' + todayDay + '/' + totalDays + '</text>' +
    '<text x="' + todayX + '" y="' + (barY - 22) + '" text-anchor="middle" font-size="13" font-weight="500" fill="' + todayColor + '">' + todayLabel + '</text>' +
    '<text x="' + (padX + usableW) + '" y="' + (barY - 22) + '" text-anchor="end" font-size="13" font-weight="500" fill="' + tickColor + '">' + pct + '%</text>' +
    '<rect x="' + padX + '" y="' + barY + '" width="' + usableW + '" height="' + barH + '" rx="5" fill="' + trackColor + '"/>' +
    '<rect x="' + padX + '" y="' + barY + '" width="' + fillW + '" height="' + barH + '" rx="5" fill="' + fillColor + '"/>' +
    '<circle cx="' + todayX + '" cy="' + (barY + barH/2) + '" r="7" fill="' + todayColor + '" stroke="' + (isDark ? '#1a1a19' : '#fcfcfb') + '" stroke-width="2"/>' +
    ticksSvg +
    '</svg>';

  document.getElementById('barWrap').innerHTML = svg;
})();
</script>
</body>
</html>
